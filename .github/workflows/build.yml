name: build

# Builds stay independent. The release workflow assembles and publishes their artifacts once.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Configure TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets before building.' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Check the dependency reports
        run: python3 scripts/dependencies.py --check
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        id: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/monhop-desktop
          tauriScript: python3 ../../scripts/tauri_ci.py
          args: ${{ matrix.args }} --ci -- --locked
          includeUpdaterJson: false
      - name: Verify macOS permission packaging
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUNDLES: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          bundles = [path for path in json.loads(os.environ['BUNDLES']) if path.endswith('.app')]
          if len(bundles) != 1:
              raise SystemExit('Expected exactly one macOS app bundle to verify before upload.')
          subprocess.run(['python3', 'scripts/verify_macos_bundle.py', bundles[0]], check=True)
          PY
      - name: Collect the bundle paths
        id: bundles
        shell: bash
        env:
          BUNDLES: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          # The signed archive supersedes the .app directory in downloadable artifacts.
          {
            echo 'paths<<MONHOP_BUNDLES'
            printf '%s' "$BUNDLES" | jq -er '.[] | select(endswith(".app") | not)'
            echo 'MONHOP_BUNDLES'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monhop-${{ matrix.target }}
          path: ${{ steps.bundles.outputs.paths }}
          if-no-files-found: error
          overwrite: true
