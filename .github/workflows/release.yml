name: release

# All three installers must exist before one publisher writes the update feed and exposes the release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: monhop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the tag against the workspace version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('The workspace release version must be X.Y.Z.')
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit(f'Tag does not match workspace version {version}.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
          python3 scripts/changelog.py notes "${GITHUB_REF_NAME#v}" > /dev/null
      - name: Require public download access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != false ]; then
            echo 'Website downloads require a public repository. This workflow does not change visibility.' >&2
            exit 1
          fi

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: monhop-*
          path: release-artifacts
      - name: Assemble all installers and the update feed
        run: |
          python3 scripts/changelog.py notes "$RELEASE_VERSION" > release-notes.md
          python3 scripts/assemble_release.py \
            --artifacts release-artifacts \
            --output release-assets \
            --version "$RELEASE_VERSION" \
            --notes-file release-notes.md \
            --repository "$GITHUB_REPOSITORY"
      - name: Create or resume the draft
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json; then
            if [ "$(jq -r .isDraft existing-release.json)" != true ]; then
              echo 'Refusing to overwrite an already published release.' >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "MonHop $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
      - name: Check uploaded assets before publication
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets > uploaded-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          assets = json.loads(Path('uploaded-assets.json').read_text())['assets']
          expected = {path.name: path.stat().st_size for path in Path('release-assets').iterdir()}
          actual = {asset['name']: asset['size'] for asset in assets}
          if len(assets) != len(expected) or actual != expected:
              raise SystemExit('The draft asset names or sizes do not match the complete local release.')
          print('Every installer, updater bundle, signature and latest.json is uploaded.')
          PY
      - name: Publish the complete release
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --title "MonHop $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --draft=false \
            --latest
      - name: Verify downloads without authentication
        env:
          GH_TOKEN: ''
        run: |
          curl --fail --silent --show-error \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" > public-release.json
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          release = json.loads(Path('public-release.json').read_text())
          if release['tag_name'] != os.environ['GITHUB_REF_NAME']:
              raise SystemExit('The public latest release is not the release just published.')
          assets = {asset['name']: asset['browser_download_url'] for asset in release['assets']}
          for path in sorted(Path('release-assets').iterdir()):
              url = assets.get(path.name)
              if not url:
                  raise SystemExit(f'Public release is missing {path.name}.')
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--head', '--location',
                              '--output', '/dev/null', url], check=True)
          print('All published downloads are accessible without authentication.')
          PY
