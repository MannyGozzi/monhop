  <rect x="72" y="72" width="880" height="880" rx="206" fill="#070809"/>
  <rect x="75" y="75" width="874" height="874" rx="203" fill="url(#tile)" stroke="url(#rim)" stroke-width="3"/>
  <rect x="80" y="80" width="864" height="864" rx="198" fill="url(#sheen)" stroke="#fff" stroke-opacity=".045" stroke-width="2"/>
  <use href="#mark" fill="#050608" filter="url(#shadow)"/>
  <use href="#mark" fill="url(#silver)" stroke="url(#bevel)" stroke-width="2.2" stroke-linejoin="round"/>
