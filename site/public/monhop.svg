<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MonHop</title>
  <desc id="desc">A silver pointer connects to three devices on a softly rounded graphite tile.</desc>
  <defs>
    <linearGradient id="tile" x1="214" y1="82" x2="780" y2="961" gradientUnits="userSpaceOnUse">
      <stop stop-color="#292a2b"/>
      <stop offset=".42" stop-color="#141517"/>
      <stop offset="1" stop-color="#090a0b"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(337 99) rotate(66) scale(610 754)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".085"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="303" y1="67" x2="671" y2="968" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".82"/>
      <stop offset=".21" stop-color="#c1c2c4" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
      <stop offset=".85" stop-color="#c1c2c4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="silver" x1=".18" y1=".08" x2=".88" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".32" stop-color="#f4f5f6"/>
      <stop offset=".68" stop-color="#d9dcdf"/>
      <stop offset="1" stop-color="#b6bcc2"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2=".8" y2="1">
