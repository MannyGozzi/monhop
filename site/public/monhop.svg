      <stop offset=".53" stop-color="#fff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".16"/>
    </linearGradient>
    <filter id="shadow" x="-.25" y="-.25" width="1.5" height="1.65" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".62"/>
    </filter>
    <g id="mark">
      <path d="M424 470C473 470 499 468 521 427C550 373 552 330 624 330V364C577 365 567 399 551 439C527 499 491 510 462 507C450 505 438 484 424 470Z"/>
      <path d="M488 521H624V555H484C489 542 490 532 488 521Z"/>
      <path d="M455 587C494 570 533 586 553 621C582 668 572 700 624 707V741C544 737 546 687 523 648C505 621 480 622 464 617Z"/>
      <rect x="640" y="276" width="124" height="128" rx="29"/>
      <rect x="640" y="467" width="124" height="128" rx="29"/>
      <rect x="640" y="658" width="124" height="128" rx="29"/>
      <path d="M246 365C232 354 218 365 221 383L260 654C263 676 278 681 291 665L318 628C322 623 328 623 332 629L378 694C387 707 402 709 415 700L427 691C440 681 442 668 433 655L397 604C393 598 395 594 402 592L451 579C469 574 474 560 459 547L246 365Z"/>
    </g>
