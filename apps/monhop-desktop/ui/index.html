<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MonHop</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./studio-canvas.css" />
    <link rel="stylesheet" href="./studio-inspector.css" />
    <link rel="stylesheet" href="./studio-setup.css" />
    <link rel="stylesheet" href="./studio-settings.css" />
  </head>
  <body>
    <main class="studio" id="studio" aria-labelledby="page-title" data-view="canvas">
      <aside class="sidebar" aria-label="Computers and settings">
        <span class="sidebar-glass" id="sidebar-glass" aria-hidden="true"></span>
        <div class="sidebar-top" data-tauri-drag-region="deep">
          <span class="brand" data-tauri-drag-region="deep"><span class="app-mark" aria-hidden="true"></span><span class="brand-name">MonHop</span></span>
        </div>
        <div class="sidebar-heading">
          <span>Computers</span>
          <span class="sidebar-heading-end"><span class="sidebar-count" id="sidebar-count"></span><span id="sidebar-refresh"></span></span>
        </div>
        <nav class="sidebar-list" id="sidebar-list" aria-label="Computers"></nav>
        <div class="sidebar-foot">
          <button class="sidebar-row sidebar-settings" type="button" id="sidebar-settings" data-select="settings" data-focus-key="sidebar-settings">
            <span class="sidebar-glyph" id="sidebar-settings-glyph" aria-hidden="true"></span>
            <span class="sidebar-row-title">Settings</span>
            <span class="sidebar-version" id="sidebar-version"></span>
          </button>
        </div>
        <span class="sidebar-indicator" id="sidebar-indicator" aria-hidden="true"></span>
      </aside>

      <section class="workspace">
        <header class="toolbar" data-tauri-drag-region="deep">
          <h1 class="toolbar-title" id="page-title" data-tauri-drag-region="deep">Arrangement</h1>
          <div class="toolbar-actions" id="toolbar-actions">
            <span class="toolbar-slot" id="network-slot">
              <button class="chip" type="button" id="network-chip" aria-haspopup="menu" aria-expanded="false" aria-controls="network-menu" aria-describedby="network-tooltip" data-focus-key="network-chip">
                <span class="status-dot" id="network-chip-dot" aria-hidden="true"></span>
                <span class="chip-label" id="network-chip-label"><span class="chip-name" id="network-chip-name">Choose a network</span><span class="chip-address" id="network-chip-address" hidden></span></span>
                <span class="chip-chevron" id="network-chip-chevron" aria-hidden="true"></span>
              </button>
              <span class="toolbar-tooltip" id="network-tooltip" role="tooltip"></span>
              <div class="menu" id="network-menu" role="menu" aria-label="Network connection" data-open="false" inert></div>
            </span>
            <span class="toolbar-slot" id="pause-slot" hidden inert></span>
            <span class="toolbar-slot" id="details-slot" hidden inert></span>
          </div>
          <div class="window-controls" id="window-controls" aria-label="Window controls" hidden>
            <button class="caption-button" type="button" data-window-action="minimize" aria-label="Minimize to the tray"><svg class="lucide lucide-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg></button>
            <button class="caption-button" type="button" data-window-action="maximize" aria-label="Maximize or restore window"><svg class="lucide lucide-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /></svg></button>
            <button class="caption-button caption-close" type="button" data-window-action="close" aria-label="Close window"><svg class="lucide lucide-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
          </div>
        </header>

        <div class="workspace-body" id="workspace-body">
          <section class="canvas-pane" id="canvas-pane" aria-label="Arrangement">
            <div class="canvas-banners" id="canvas-banners"></div>
            <div class="canvas-stage" id="canvas-stage"></div>
            <span class="canvas-arrange" id="arrange-slot" hidden inert></span>
            <div class="canvas-dock" id="canvas-dock"></div>
            <footer class="status-bar" id="status-bar">
              <span class="status-bar-state" role="status" aria-live="polite"><span class="status-dot" id="status-bar-dot" aria-hidden="true"></span><span class="status-bar-text" id="status-bar-text">Not checked</span></span>
              <span class="status-bar-escape" id="status-bar-escape"><span>Hold both Control keys and Esc for 2 seconds to take your keyboard and mouse back.</span></span>
            </footer>
          </section>

          <div class="inspector-scrim" id="inspector-scrim" data-open="false" aria-hidden="true"></div>
          <aside class="inspector" id="inspector" aria-label="Details" data-open="true">
            <button class="inspector-close icon-button button" type="button" id="inspector-close" data-variant="ghost" aria-label="Close details"><svg class="lucide lucide-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
            <div class="inspector-scroll" id="inspector-scroll"><div class="inspector-content" id="inspector-content"></div></div>
          </aside>

          <section class="settings-pane" id="settings-view" aria-label="Settings" data-open="false" inert>
            <div class="settings-scroll" id="settings-scroll"><div class="settings-content" id="settings-content"></div></div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
