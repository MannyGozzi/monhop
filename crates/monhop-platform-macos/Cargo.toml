[package]
name = "monhop-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[example]]
name = "native_window"
test = true

[dependencies]
monhop-core = { path = "../monhop-core", version = "=0.1.2" }
log = "=0.4.34"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework-sys = { version = "=2.17.0", default-features = false, features = ["OSX_10_15"] }
zeroize = "=1.9.0"
tokio = { version = "=1.53.1", default-features = false, features = ["net"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "time", "sync"] }

[lints]
workspace = true
