[package]
name = "monhop-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
monhop-core = { path = "../monhop-core", version = "=0.2.2" }
monhop-protocol = { path = "../monhop-protocol", version = "=0.2.2" }
bytes = { version = "=1.12.1", default-features = false }
log = "=0.4.34"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
sha2 = "=0.11.0"
zeroize = "=1.9.0"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync"] }

[dev-dependencies]
quinn-proto = { version = "=0.11.18", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
monhop-platform-macos = { path = "../monhop-platform-macos", version = "=0.2.2" }

[target.'cfg(windows)'.dependencies]
monhop-platform-windows = { path = "../monhop-platform-windows", version = "=0.2.2" }

[lints]
workspace = true
